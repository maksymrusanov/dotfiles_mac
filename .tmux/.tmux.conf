# -----------------------------
# TMUX CONFIG — Black & Red Theme (Mac/i3-style)
# -----------------------------

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ===== Shell =====
set -g default-shell /bin/zsh

# ===== Status =====
set -g status-style bg=black,fg=red
set -g status-left "#[fg=red,bold]#S#[fg=red]|#[fg=red]"
set -g status-right '#[fg=red]%H:%M'
# ===== Windows =====
setw -g window-status-current-format "#[fg=red]#W*"
setw -g window-status-format "#[fg=red]#I:#W" 
# ===== Automatic rename =====
set -g automatic-rename on
set -g automatic-rename-format "#[fg=red]#{pane_current_command}#[default]"

# ===== Panels / Splits =====
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v
bind v split-window -h
bind s split-window -v

# Быстрые маленькие splits (25%)
bind-key q split-window -v -p 25 \; select-pane -t 0
bind-key w split-window -h -p 25 \; select-pane -t 0

# ===== Navigation (Vim style) =====
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Быстрый ресайз на Mac
bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up    resize-pane -U 3
bind -n C-M-Down  resize-pane -D 3

# ===== Window logic =====
bind-key 0 select-window -t 0
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# ===== Mouse =====
set -g mouse on

# ===== Commands =====
bind-key K kill-server
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# ===== TPM =====
run-shell ~/.tmux/plugins/tpm/tpm
