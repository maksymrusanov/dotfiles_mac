# -----------------------------
# TMUX CONFIG — Black & Red Theme (Mac/i3-style)
# -----------------------------

# ===== TPM (Plugin Manager) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# NOTE: tmux-cpu is optional (can be heavy)
# set -g @plugin 'tmux-plugins/tmux-cpu'

# ===== Shell =====
set -g default-shell /bin/zsh

# ===== Status Bar =====
set -g status on
set -g status-interval 2
set -g status-style bg=black,fg=red

set -g status-left "#[fg=red,bold] #S #[fg=red]|"
set -g status-right "#[fg=red]%H:%M"

# ===== Windows =====
setw -g window-status-current-format "#[fg=red,bold]#W*"
setw -g window-status-format "#[fg=red]#I:#W"

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# ===== Panes (focus styling) =====
set -g pane-border-style fg=colour244
set -g pane-active-border-style fg=red,bold

set -g pane-border-status top
set -g pane-border-format "#[bold] #{pane_current_command} "

# ===== Splits =====
unbind %
unbind '"'

bind | split-window -h
bind - split-window -v

bind v split-window -h
bind s split-window -v

# Quick splits
bind q split-window -v -p 25 \; select-pane -t 0
bind w split-window -h -p 25 \; select-pane -t 0

# Optional: custom tool pane
bind o split-window -h -p 45 "copilot" \; select-pane -t 0

# ===== Resize (Mac-friendly) =====
bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up    resize-pane -U 3
bind -n C-M-Down  resize-pane -D 3

# ===== Navigation (Vim style) =====
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ===== Windows shortcuts =====
bind-key 0 select-window -t 0
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# ===== Mouse support =====
set -g mouse on

# ===== Commands =====
bind-key K kill-server
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# ===== TPM init =====
run-shell '~/.tmux/plugins/tpm/tpm'
