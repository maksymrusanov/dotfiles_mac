# -----------------------------
# TMUX CONFIG — Black & Red Theme
# -----------------------------

# ===== Плагины =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ===== Shell =====
set-option -g default-shell /bin/zsh

# =====Status=====
set -g status-style bg=black              
set -g status-left "#[fg=red]#I#[default]"   
set -g status-right "#[fg=red] %H:%M #[default]"       

# Активное окно с красной звездочкой
setw -g window-status-current-format "#[fg=red]:#W#[fg=red]*#[default]"
# Остальные окна просто красные
setw -g window-status-format "#[fg=red]#I:#W#[default]"

# ===== window rename=====
set -g automatic-rename on
set -g automatic-rename-format "#[fg=red]#{pane_current_command}#[default]"

# ===== panels=====
unbind %
unbind '"'

bind '|' split-window -h
bind '-' split-window -v

bind-key q split-window -v -p 25 \; select-pane -t 0
bind-key w split-window -h -p 25 \; select-pane -t 0

# =====Navigation=====
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ===== window logic=====
bind-key 0 switch-client -t 0
bind-key 1 switch-client -t 1
bind-key 2 switch-client -t 2
bind-key 3 switch-client -t 3
bind-key 4 switch-client -t 4
bind-key 5 switch-client -t 5
bind-key 6 switch-client -t 6
bind-key 7 switch-client -t 7
bind-key 8 switch-client -t 8
bind-key 9 switch-client -t 9
# ===== Mouse=====
set -g mouse on

# ===== commands=====
bind-key k kill-server                            # закрыть tmux
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"  # перезагрузка конфига

# ===== plugins=====
run-shell ~/.tmux/plugins/tpm/tpm
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
