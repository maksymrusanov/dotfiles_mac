# ==============================
# ULTRA-FAST KITTY CONFIG
# ==============================
# Font
font_family      JetBrains Mono
italic_font      auto
bold_font        auto
bold_italic_font auto
font_size        17
disable_ligatures always
# Window
background_opacity 0.7
window_padding_width 0

# Cursor
cursor_shape block
cursor_shape_unfocused beam

# Scrolling
map opt+cmd+up scroll_line_up
map opt+cmd+down scroll_line_down
map shift+cmd+up scroll_page_up
map shift+cmd+down scroll_page_down

# Background
background_image_layout cscaled
background_tint       0.9
background_tint_gaps  -10

# Bells
enable_audio_bell yes
# Ultra-fast exit
confirm_os_window_close 0
